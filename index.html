<!doctype html><html lang="pt"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#062e59"/><title>RJP Mobilis Leiria</title>  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
</head><body><div id="root"></div><script>
(function(){
 function show(message){
  var el=document.getElementById('rjp-startup-error');
  if(!el){el=document.createElement('div');el.id='rjp-startup-error';el.style='position:fixed;z-index:999999;inset:0;overflow:auto;background:#f5f8fc;color:#062e59;padding:28px;font:16px system-ui';document.body.appendChild(el)}
  el.textContent='RJP Mobilis Leiria — erro ao iniciar: '+String(message)+'. Envia esta mensagem para corrigirmos.';
 }
 window.addEventListener('error',function(e){show(e.message||'Erro JavaScript')});
 window.addEventListener('unhandledrejection',function(e){show(e.reason?.message||e.reason||'Falha de carregamento')});
 setTimeout(function(){if(!document.querySelector('#root')?.children.length)show('A interface não carregou. Verifica se os ficheiros JavaScript estão acessíveis.')},12000);
 if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(regs){regs.forEach(function(reg){if(reg.scope.includes('/RJP-Mobilis-Leiria-/'))reg.unregister()})}).catch(function(){})}
})();
</script><script type="module" src="/src/main.jsx"></script></body></html>
