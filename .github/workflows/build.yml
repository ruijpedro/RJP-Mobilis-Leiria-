name: WebApp e Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - env:
          VITE_MOBILIS_CATALOG_URL: ${{ vars.VITE_MOBILIS_CATALOG_URL }}
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-WebApp
          path: dist/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK (sdkmanager por caminho absoluto)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -mindepth 3 -maxdepth 3 -path '*/bin/sdkmanager' -type f 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Não foi encontrado sdkmanager em $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"
          "$SDKMANAGER" --version
          (yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null) || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - run: npm install
      - env:
          VITE_MOBILIS_CATALOG_URL: ${{ vars.VITE_MOBILIS_CATALOG_URL }}
        run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - name: Aplicar ícone RJP Mobilis na APK
        run: python3 scripts/install_android_icons.py
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-APK-debug
          path: android/app/build/outputs/apk/debug/*.apk
