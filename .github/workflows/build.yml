name: Compilar WebApp e APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mobilis-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Testes e compilação Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Testes JavaScript
        run: npm test
      - name: Testes Python
        run: python -m unittest discover -s tests -p '*.test.py' || (python tests/reviewed-gtfs.test.py && python tests/osm-network.test.py)
      - name: Compilar WebApp
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-WebApp-V1.9-RC1
          path: dist/
          if-no-files-found: error
  android:
    name: Compilar APK debug
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Compilar WebApp
        run: npm run build
      - name: Criar projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-Android-debug-V1.9-RC1
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
