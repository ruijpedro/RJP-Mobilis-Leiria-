name: Compilar WebApp e APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: mobilis-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Testes e compilação Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
      - name: Testes JavaScript
        run: npm test
      - name: Testes Python
        run: python -m unittest discover -s tests -p '*.test.py' || (python tests/reviewed-gtfs.test.py && python tests/osm-network.test.py)
      - name: Gerar ícones personalizados WebApp
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_web_icons.py
      - name: Compilar WebApp
        run: |
          npm run build
          python scripts/verify_web_icons.py
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-WebApp-V1.10.4
          path: dist/
          if-no-files-found: error
  android:
    name: Compilar APK debug
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Instalar dependências
        run: |
          npm install --no-audit --no-fund
      - name: Gerar ícones personalizados WebApp
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_web_icons.py
      - name: Compilar WebApp
        run: |
          npm run build
          python scripts/verify_web_icons.py
      - name: Criar projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          python scripts/ensure_gps_permissions.py
      - name: Aplicar ícone RJP Mobilis Leiria
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_android_icons.py
      - name: Gerar APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --stacktrace
      - name: Verificar ícones na APK debug
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          unzip -Z1 "$APK" | grep -Eq 'res/mipmap-[^/]+/ic_launcher[^/]*\\.png' || { echo 'Ícone RJP não encontrado na APK'; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-Android-debug-V1.10.4
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
