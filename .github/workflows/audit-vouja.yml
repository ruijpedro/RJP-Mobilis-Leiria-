name: Analisar fonte pública JáVou
on:
  workflow_dispatch:
  push:
    branches: [motor-3-experimental]
    paths: ['.github/workflows/audit-vouja.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar endereços públicos
        run: |
          mkdir -p vouja-review
          i=0
          for url in https://javou.pt/ https://javou.pt/vehicle/mobilis/g-cninmejv8e; do
            i=$((i+1))
            curl --location --max-redirs 4 --max-time 25 --max-filesize 5000000 --proto '=http,https' --proto-redir '=http,https' --user-agent 'RJP Mobilis source audit' --dump-header "vouja-review/$i-headers.txt" --output "vouja-review/$i.html" --write-out '%{http_code} %{url_effective}\n' "$url" > "vouja-review/$i-status.txt" 2>"vouja-review/$i-error.txt" || true
            cat "vouja-review/$i-status.txt" "vouja-review/$i-error.txt"
          done
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','link','a'):
                      u=a.get('src') or a.get('href')
                      if u: self.links.append({'tag':tag,'url':u})
          root=Path('vouja-review')
          results=[]
          for i in range(1,3):
              status=(root/f'{i}-status.txt').read_text().strip()
              p=Parser()
              f=root/f'{i}.html'
              if status.startswith('200 ') and f.exists():
                  p.feed(f.read_text(errors='replace'))
              results.append({'status':status,'links':p.links})
          (root/'links.json').write_text(json.dumps(results,indent=2))
          print('Public references:',sum(len(r['links']) for r in results))
          if not any(r['links'] for r in results):
              raise SystemExit('No usable public references collected')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vouja-public-source-review
          path: vouja-review/
          retention-days: 7
