name: Analisar fonte pública VouJá
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar página pública
        run: |
          mkdir -p vouja-review
          curl --location --max-redirs 4 --max-time 30 --max-filesize 5000000 --proto '=http,https' --proto-redir '=http,https' --user-agent 'RJP Mobilis source audit' --dump-header vouja-review/headers.txt --output vouja-review/index.html --write-out '%{http_code} %{url_effective}\n' https://vouja.pt/ > vouja-review/status.txt || true
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','link','a'):
                      u=a.get('src') or a.get('href')
                      if u: self.links.append({'tag':tag,'url':u})
          p=Parser()
          f=Path('vouja-review/index.html')
          if f.exists(): p.feed(f.read_text(errors='replace'))
          Path('vouja-review/links.json').write_text(json.dumps(p.links,indent=2))
          print(Path('vouja-review/status.txt').read_text())
          print('Public references:',len(p.links))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vouja-public-source-review
          path: vouja-review/
          retention-days: 7
