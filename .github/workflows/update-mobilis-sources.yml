name: Verificar fontes oficiais Mobilis
on:
  workflow_dispatch:
  schedule:
    - cron: '15 5 * * 1'
permissions:
  contents: write
jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rever ligações oficiais das linhas 1 a 9
        run: python scripts/update_mobilis_sources.py
      - name: Publicar catálogo de fontes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/mobilis-sources.json
          git diff --cached --quiet || (git commit -m 'Verificar fontes Mobilis' && git push)
