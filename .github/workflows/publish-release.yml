name: Publicar RJP Mobilis (WebApp + APK assinada)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release (formato v1.10.16)'
        required: true
        type: string
        default: 'v1.10.16'

permissions:
  contents: write

concurrency:
  group: mobilis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Confirmar versão e assinatura configurada
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ENCRYPTION_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_ENCRYPTION_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: rjp-mobilis
          KEY_PASSWORD: ${{ secrets.MOBILIS_KEY_PASSWORD }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versão inválida. Usa v1.10.16 (três números, sem espaços)'; exit 1; }
          for v in ENCRYPTION_PASSWORD KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Falta secret $v"; exit 1; fi
          done
      - name: Instalar e testar
        run: |
          npm install --no-audit --no-fund
          npm test
          node scripts/audit_network.mjs
          python scripts/verify_osm_data.py
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_web_icons.py
          npm run build
          python scripts/verify_web_icons.py
      - name: Criar pacote WebApp
        run: |
          cd dist && zip -qr ../RJP-Mobilis-WebApp.zip .
      - name: Preparar Android e ícones
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          python scripts/ensure_gps_permissions.py
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_android_icons.py
      - name: Configurar versão Android
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os,re,pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          if not re.search(r'\bversionCode\s+\d+',s): raise SystemExit("versionCode não encontrado")
          if not re.search(r'\bversionName\s+"[^"]+"',s): raise SystemExit("versionName não encontrado")
          # Código de versão crescente entre versões semânticas.
          major,minor,patch=map(int,os.environ["RELEASE_VERSION"][1:].split("."))
          code=major*1000000+minor*10000+patch*100
          if code > 2100000000: raise SystemExit("versionCode excede limite Android")
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {code}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{os.environ["RELEASE_VERSION"][1:]}"',s,count=1)
          p.write_text(s)
          PY
      - name: Compilar APK release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --stacktrace
      - name: Verificar ícone Android incluído na APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK" || { echo 'APK não encontrada'; exit 1; }
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/mobilis-badging.txt"
          grep '^application:' "$RUNNER_TEMP/mobilis-badging.txt" || { echo 'Metadados do ícone Android em falta'; exit 1; }
          # O Android AAPT2 compila/renomeia recursos. Não procurar caminhos
          # res/mipmap-.../ic_launcher.png no ZIP: esses caminhos podem deixar
          # de existir apesar de o ícone estar corretamente embutido.
          python - <<'PY'
          import re, zipfile
          from pathlib import Path
          apk=Path("android/app/build/outputs/apk/release/app-release-unsigned.apk")
          badging=Path(__import__('os').environ["RUNNER_TEMP"]+"/mobilis-badging.txt").read_text()
          match=re.search(r"^application:.*?icon='([^']+)'",badging,re.M)
          if not match:
              raise SystemExit("APK sem ícone de launcher nos metadados")
          icon=match.group(1)
          with zipfile.ZipFile(apk) as z:
              if icon not in z.namelist():
                  raise SystemExit(f"Recurso de ícone não incluído no APK: {icon}")
              if z.getinfo(icon).file_size < 100:
                  raise SystemExit(f"Recurso de ícone vazio: {icon}")
          print(f"Ícone Android confirmado na APK: {icon}")
          PY
      - name: Assinar e verificar APK
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_ENCRYPTION_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: rjp-mobilis
          KEY_PASSWORD: ${{ secrets.MOBILIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f signing/mobilis.jks.enc || { echo "Executa primeiro Criar chave Android Mobilis"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/mobilis.jks.enc -out "$RUNNER_TEMP/mobilis.jks" \
            -pass env:ENCRYPTION_PASSWORD
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mobilis.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out RJP-Mobilis-Leiria.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose RJP-Mobilis-Leiria.apk
          rm -f "$RUNNER_TEMP/mobilis.jks"
      - name: Confirmar identidade e assinatura Android
        run: |
          set -euo pipefail
          APK="RJP-Mobilis-Leiria.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" > "$RUNNER_TEMP/mobilis-release-badging.txt"
          "$SIGNER" verify --print-certs "$APK" > "$RUNNER_TEMP/mobilis-release-certs.txt"
          python - <<'PY'
          import re
          from pathlib import Path
          import os
          badging=Path(os.environ["RUNNER_TEMP"],"mobilis-release-badging.txt").read_text()
          certs=Path(os.environ["RUNNER_TEMP"],"mobilis-release-certs.txt").read_text()
          package=re.search(r"^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'",badging,re.M)
          digest=re.search(r"Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]+)",certs)
          if not package: raise SystemExit("Não foi possível ler a identidade da APK")
          if package.group(1)!="pt.rjp.mobilisleiria":
              raise SystemExit(f"Identificador Android inesperado: {package.group(1)}")
          if not digest: raise SystemExit("Assinatura Android não encontrada")
          info=(f"Pacote: {package.group(1)}\\n"
                f"versionCode: {package.group(2)}\\n"
                f"versionName: {package.group(3)}\\n"
                f"Certificado SHA-256: {digest.group(1)}\\n"
                "Canal: release assinada; não instalar APK debug para atualizar.\\n")
          Path("RJP-Mobilis-Identidade-Android.txt").write_text(info,encoding="utf-8")
          print(info)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8") as out:
              out.write("### Identidade da APK assinada\\n```\\n"+info+"```\\n")
          PY
      - name: Garantir compatibilidade com a APK anterior
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PREVIOUS="$(gh release list --limit 30 --json tagName --jq '.[].tagName' | grep -Fxv "$RELEASE_VERSION" | head -n 1 || true)"
          if [ -z "$PREVIOUS" ]; then
            echo "::error::Sem versão anterior: é necessária comparação com APK base antes da release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/previous-mobilis"
          if ! gh release download "$PREVIOUS" --pattern 'RJP-Mobilis-Leiria.apk' --dir "$RUNNER_TEMP/previous-mobilis"; then
            echo "::error::APK anterior indisponível. Publicação bloqueada para não trocar inadvertidamente o certificado."
            exit 1
          fi
          python scripts/check_android_upgrade.py "$RUNNER_TEMP/previous-mobilis/RJP-Mobilis-Leiria.apk" RJP-Mobilis-Leiria.apk "$ANDROID_HOME/build-tools/35.0.0/aapt" "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - name: Publicar diagnóstico de identidade Android
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-Identidade-Android
          path: RJP-Mobilis-Identidade-Android.txt
          if-no-files-found: error
      - name: Disponibilizar APK assinada para teste
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-Leiria-APK-assinada
          path: RJP-Mobilis-Leiria.apk
          if-no-files-found: error
          retention-days: 30
      - name: Disponibilizar WebApp para teste
        uses: actions/upload-artifact@v4
        with:
          name: RJP-Mobilis-Leiria-WebApp
          path: RJP-Mobilis-WebApp.zip
          if-no-files-found: error
          retention-days: 30
      - name: Bloquear publicação se o tag já existir
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "::error::Release já existente. Usa uma versão superior para permitir atualização Android."
            exit 1
          fi
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ! gh release create "$RELEASE_VERSION" RJP-Mobilis-Leiria.apk RJP-Mobilis-WebApp.zip \
            --target "$GITHUB_SHA" \
            --title "RJP Mobilis Leiria $RELEASE_VERSION" \
            --notes "APK Android assinada e WebApp. Horários programados; não equivalem a localização em tempo real."; then
            echo "::warning::Sem permissão para criar GitHub Release. A APK assinada e a WebApp estão disponíveis nos artefactos desta execução."
            echo "### Download para teste" >> "$GITHUB_STEP_SUMMARY"
            echo "A publicação da Release falhou por permissões. Descarrega os artefactos APK assinada e WebApp desta execução." >> "$GITHUB_STEP_SUMMARY"
          fi
