name: Publicar RJP Mobilis (WebApp + APK assinada)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da release, por exemplo v1.9.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: mobilis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Confirmar versão e assinatura configurada
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          ENCRYPTION_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_ENCRYPTION_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: rjp-mobilis
          KEY_PASSWORD: ${{ secrets.MOBILIS_KEY_PASSWORD }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Versão inválida (usar v1.9.1)'; exit 1; }
          for v in ENCRYPTION_PASSWORD KEYSTORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "Falta secret $v"; exit 1; fi
          done
      - name: Instalar e testar
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
          npm test
          npm run build
      - name: Criar pacote WebApp
        run: |
          cd dist && zip -qr ../RJP-Mobilis-WebApp.zip .
      - name: Preparar Android e ícones
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android
          python scripts/ensure_gps_permissions.py
          python -m pip install --disable-pip-version-check Pillow
          python scripts/generate_android_icons.py
      - name: Configurar versão Android
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os,re,pathlib
          p=pathlib.Path("android/app/build.gradle")
          s=p.read_text()
          if not re.search(r'\bversionCode\s+\d+',s): raise SystemExit("versionCode não encontrado")
          if not re.search(r'\bversionName\s+"[^"]+"',s): raise SystemExit("versionName não encontrado")
          # Código de versão crescente entre versões semânticas.
          major,minor,patch=map(int,os.environ["RELEASE_VERSION"][1:].split("."))
          code=major*1000000+minor*10000+patch*100
          if code > 2100000000: raise SystemExit("versionCode excede limite Android")
          s=re.sub(r'\bversionCode\s+\d+',f'versionCode {code}',s,count=1)
          s=re.sub(r'\bversionName\s+"[^"]+"',f'versionName "{os.environ["RELEASE_VERSION"][1:]}"',s,count=1)
          p.write_text(s)
          PY
      - name: Compilar APK release
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleRelease --stacktrace
      - name: Assinar e verificar APK
        env:
          ENCRYPTION_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_ENCRYPTION_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILIS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: rjp-mobilis
          KEY_PASSWORD: ${{ secrets.MOBILIS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -f signing/mobilis.jks.enc || { echo "Executa primeiro Criar chave Android Mobilis"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in signing/mobilis.jks.enc -out "$RUNNER_TEMP/mobilis.jks" \
            -pass env:ENCRYPTION_PASSWORD
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mobilis.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out RJP-Mobilis-Leiria.apk "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose RJP-Mobilis-Leiria.apk
          rm -f "$RUNNER_TEMP/mobilis.jks"
      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" RJP-Mobilis-Leiria.apk RJP-Mobilis-WebApp.zip \
            --target "$GITHUB_SHA" \
            --title "RJP Mobilis Leiria $RELEASE_VERSION" \
            --notes "APK Android assinada e WebApp. Horários programados; não equivalem a localização em tempo real."
