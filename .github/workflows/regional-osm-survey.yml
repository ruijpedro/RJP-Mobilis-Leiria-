name: Levantamento paragens intermunicipais Leiria
on:
  workflow_dispatch:
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testar extrator
        run: python -m unittest discover -s tests -p 'test_osm_regional_routes.py' -v
      - name: Consultar OpenStreetMap via Overpass
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, time, urllib.request, urllib.error
          query=Path('scripts/overpass_leiria_regional.ql').read_bytes()
          endpoints=[
              'https://overpass.private.coffee/api/interpreter',
              'https://overpass-api.de/api/interpreter',
              'https://overpass.kumi.systems/api/interpreter',
          ]
          errors=[]
          for url in endpoints:
              try:
                  print('A consultar:',url,flush=True)
                  req=urllib.request.Request(url,data=query,headers={'User-Agent':'RJP-Mobilis-Leiria/1.0 (regional stop survey)','Content-Type':'text/plain; charset=utf-8'})
                  with urllib.request.urlopen(req,timeout=75) as response:
                      payload=response.read()
                  parsed=json.loads(payload)
                  if not isinstance(parsed.get('elements'),list):
                      raise ValueError('Resposta sem lista de elementos OSM')
                  if not parsed['elements']:
                      raise ValueError('Resposta vazia; verificar área e consulta')
                  Path('regional-overpass.json').write_bytes(payload)
                  print('Elementos recebidos:',len(parsed['elements']),flush=True)
                  break
              except (TimeoutError,OSError,ValueError,json.JSONDecodeError) as exc:
                  errors.append(f'{url}: {exc}')
                  print('Falha neste servidor:',str(exc),flush=True)
                  time.sleep(2)
          else:
              raise SystemExit('Nenhum servidor Overpass respondeu corretamente. '+ ' | '.join(errors))
          PY
      - name: Extrair candidatos sem publicar no mapa
        run: |
          python scripts/import_osm_regional_routes.py regional-overpass.json regional-candidates.json
          python - <<'PY'
          import json
          d=json.load(open('regional-candidates.json'))
          print('Paragens para revisão:',len(d['stops']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: leiria-regional-candidates
          path: |
            regional-candidates.json
            regional-overpass.json
          retention-days: 14
