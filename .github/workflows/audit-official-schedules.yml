name: Auditar horários oficiais Mobilis

on:
  workflow_dispatch:
  schedule:
    - cron: '15 8 * * 3'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar ferramentas PDF (modo degradado se apt indisponível)
        shell: bash
        run: |
          set -uo pipefail
          missing=()
          command -v pdftotext >/dev/null || missing+=(poppler-utils)
          command -v tesseract >/dev/null || missing+=(tesseract-ocr tesseract-ocr-por tesseract-ocr-eng)
          if (( ${#missing[@]} )); then
            echo "::notice::Ferramentas PDF em falta: ${missing[*]}. A tentar instalar."
            installed=false
            for attempt in 1 2; do
              if sudo apt-get update -qq -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 &&
                 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 "${missing[@]}"; then
                installed=true
                break
              fi
              echo "::warning::Instalação indisponível (tentativa ${attempt}); a auditoria vai continuar."
              sleep 3
            done
            if [[ "$installed" != true ]]; then
              echo "::warning::Sem instalação completa; serão conservados os PDF/SVG oficiais e registadas as falhas de extração."
            fi
          fi
          command -v pdftotext >/dev/null && echo "pdftotext: disponível" || echo "pdftotext: indisponível"
          command -v tesseract >/dev/null && echo "tesseract: disponível" || echo "tesseract: indisponível"
      - name: Verificar scripts de extração
        run: python -m py_compile scripts/audit_official_schedules.py scripts/extract_official_pdf_for_review.py
      - name: Extrair referências e metadados das tabelas Mobilis
        run: |
          python scripts/audit_official_schedules.py --out audit/horarios
      - name: Extrair texto dos PDFs (OCR apenas quando necessário)
        run: python scripts/extract_official_pdf_for_review.py
      - name: Resumo da auditoria
        if: always()
        run: |
          if [ -f audit/horarios/RESUMO.md ]; then cat audit/horarios/RESUMO.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f audit/horarios/transcricoes/indice.json ]; then echo "Transcrições e índice disponíveis no artefacto para revisão das paragens e das horas." >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobilis-horarios-oficiais-para-revisao
          path: audit/horarios/
          if-no-files-found: warn
