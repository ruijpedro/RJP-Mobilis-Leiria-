name: Publish WebApp (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Verificar ficheiros da WebApp antes de publicar
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          grep -q '/RJP-Mobilis-Leiria-/assets/' dist/index.html || { echo "::error::O HTML não aponta para os recursos no caminho correto do GitHub Pages"; exit 1; }
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('dist/index.html','utf8');
          const urls=[...html.matchAll(/(?:src|href)="(\/RJP-Mobilis-Leiria-\/assets\/[^"]+)"/g)].map(x=>x[1]);
          if(!urls.some(u=>u.endsWith('.js')))throw Error('Nenhum JavaScript da WebApp referenciado no HTML');
          for(const url of urls){
            const local='dist/'+url.slice('/RJP-Mobilis-Leiria-/'.length);
            if(!fs.existsSync(local)||!fs.statSync(local).size)throw Error('Recurso em falta: '+local);
          }
          console.log('Verificados '+urls.length+' recursos JavaScript/CSS referenciados no HTML.');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
